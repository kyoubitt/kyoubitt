name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=black
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=white

      - name: inline css variables
        run: |
          python3 - <<'PY'
          import re, glob
          for f in glob.glob("dist/*.svg"):
              s = open(f).read()
              v = dict(re.findall(r"(--[a-z0-9]+):([^;}]+)", s.split("</style>")[0]))
              s = re.sub(r"var\((--[a-z0-9]+)\)", lambda m: v[m.group(1)], s)
              open(f, "w").write(s)
          PY

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
